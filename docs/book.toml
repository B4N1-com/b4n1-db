[book]
title = "b4n1-db — Sovereign Embedded Data Layer"
description = "One handle over eight local storage engines: key-value, SQL, graph, documents, queues, vectors, audit and migrations — no server, no daemon, no network"
language = "en"
src = "src"

[output.html]
default-theme = "light"
smart-punctuation = true
mathjax-support = false
git-repository-url = "https://github.com/B4N1-com/b4n1-db"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/B4N1-com/b4n1-db/edit/master/docs/src/{path}"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 10
teaser-word-count = 30
use-boolean-and = true
boost-title = 3
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3

[build]
build-dir = "book"
create-missing = false

# Playground disabled: mdBook implements it by calling a third-party service
# from the visitor's browser. Our documentation site must not fire external
# requests on behalf of whoever reads it.
[output.html.playground]
runnable = false
editable = false
